# =============================================================================
# CF-Connect 配置示例  (v0.1.1)
# =============================================================================
# 三步上手（配置固定放在 ~/.cf-connect/config.toml，Windows 上是 %USERPROFILE%\.cf-connect\config.toml；
#          它和会话历史 / 日志 / socket 同处一个目录，换程序版本或换解压位置都不会丢）：
#   1. 首次运行会把这份样例写到该路径，然后退出：
#      cf-connect.exe --config "%USERPROFILE%\.cf-connect\config.toml"
#   2. 填下面 4 个地方：work_dir（必须是真实存在的目录）、cmd、client_id、client_secret
#   3. cf-connect.exe            （前台跑，看到日志即成功）
#      cf-connect.exe daemon install --config "%USERPROFILE%\.cf-connect\config.toml"   （常驻）
#
# 说明：除了 [[projects]] 和它的 agent / platforms 两块，其余都是可选项；
#       不需要的整段删掉或注释掉都不影响启动。
# =============================================================================

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
[log]
level = "info" # debug | info | warn | error


# -----------------------------------------------------------------------------
# 语言
# -----------------------------------------------------------------------------
# 机器人回复的 UI 语言：en | zh
# 不设置则根据收到的消息自动检测，或设置为 "auto"。
language = "zh"


# -----------------------------------------------------------------------------
# 回复渲染
# -----------------------------------------------------------------------------
[display]
mode = "full"              # full | compact | quiet
thinking_messages = true   # 显示模型的思考块
tool_messages = true       # 显示工具调用和结果

[instant_reply]
enabled = false
# text = "🤔 思考中..."


# =============================================================================
# 项目
# =============================================================================
# 一个项目将一个 agent（及其 work_dir）绑定到一个或多个平台。
# 大多数部署只需要一个。
# =============================================================================

[[projects]]
name = "my-project"

# 可选：谁可以运行管理命令（/dir、/shell、/show、/diff、/web、/restart）。
# 留空 = 所有人都不能运行（fail-closed），不是"继承 allow_from"。
# admin_from = "你的钉钉userId"

# --- Agent：CodeFree-O / OpenCode -------------------------------------------
[projects.agent]
# "opencode" 和 "codefree-o" 选择同一个适配器；选择与你安装的 CLI 匹配的即可。
type = "opencode"

[projects.agent.options]
# ⚠️ 必须改（这里是占位符）：改成你机器上**真实存在**的目录。
# 目录不存在时，服务能起来，但你在钉钉里发的第一句话会报：
#   Error: opencodeSession: start: chdir <这里填的路径>: The system cannot find the file specified.
# 想换目录也可以不改这里：在钉钉里发 /dir <绝对路径> 随时切换。
work_dir = "D:\\工作目录"

# 要驱动的 CLI。可以写 PATH 里的名字，也可以写绝对路径（常驻服务推荐绝对路径，
# 因为服务进程不会继承你终端里的 PATH）。
# ⚠️ 千万别填 codefree-o.ps1：npm 装法的 codefree-o 有 无扩展名 / .cmd / .ps1 三份 shim，
#    PowerShell 里 Get-Command codefree-o 常常给你 .ps1，而 cf-connect 用 Go 的 exec 拉不起 .ps1
#    （症状：服务正常、日志正常，钉钉里第一句话报 `CLI not found in PATH`）。
#    取法：$shim = (Get-Command codefree-o.cmd).Source，再用同目录下的
#    node_modules\@srdcloud\codefree-o\bin\codefree-o.exe（存在就用它，否则用 $shim）。
#   cmd = "codefree-o"
#   cmd = ["C:\\nvm4w\\nodejs\\node_modules\\@srdcloud\\codefree-o\\bin\\codefree-o.exe"]
cmd = "codefree-o"

# 权限模式。这只决定是否在 CLI 命令行后附加"跳过权限"标志。
#   default = 不追加任何标志，由 CLI 自己的规则决定
#   yolo    = 追加下面的 permission_flag（默认 --auto）
# 注意：cf-connect 没有交互式权限确认，default 也不等于"安全模式"。
mode = "default"

# model = "codefree/GLM-5.2"   # `codefree-o models` 查看可用模型
# agent = "build"              # 传给 CLI 的 --agent（build | plan）

# --- 高级（一般不用改，需要时取消注释） --------------------------------------
# yolo 模式追加的标志。当前 OpenCode(>=1.18) 与 CodeFree-O 都支持 --auto；
# 老版本 OpenCode 可写 --dangerously-skip-permissions，写 "none" 表示不追加。
# permission_flag = "--auto"

# 会话库位置。cf-connect 直接从 CLI 的本地 sqlite 读会话标题与消息数
# （进程内读取，不需要 sqlite3 命令）。按二进制名自动识别：
#   opencode   -> ~/.local/share/opencode/opencode.db
#   codefree-o -> ~/.codefree-o/.local/share/codefree.db
# data_dir = "C:\\Users\\you\\.codefree-o\\.local\\share"
# db_file = "codefree.db"

# 全局记忆文件。codefree-o 自动识别 ~/.codefree-o/.config/OPENCODE.md，
# 其次是 AGENTS.md；都没有则回退 ~/.opencode/OPENCODE.md。
# global_memory_file = "C:\\Users\\you\\.codefree-o\\.config\\OPENCODE.md"

# 给 agent 进程追加环境变量。
# [projects.agent.options.env]
# HTTPS_PROXY = "http://127.0.0.1:7890"


# --- 平台：钉钉 --------------------------------------------------------------
[[projects.platforms]]
type = "dingtalk"

[projects.platforms.options]
# 来自你的钉钉企业内部应用（参见 QUICKSTART.md）。每个人运行自己的应用，
# 因此这些是每台机器的凭据。
client_id = "client_id"
client_secret = "client_secret"

# 可选但强烈推荐：限制谁可以与机器人对话
# （逗号分隔的钉钉用户 ID；"*" 允许所有人）。在钉钉中发送 /whoami
# 可以发现自己的 ID，然后填入此处。
# 注意：这个键必须放在 [projects.platforms.options] 下；写在 [[projects]]
# 里会被 TOML 解码器静默丢弃，机器人就会对所有人开放。
# allow_from = "你的钉钉userId"

# 可选：AI 卡片流式输出。这是钉钉唯一的流式路径 ——
# 不启用它，回复会在整个回合结束后作为一条纯 markdown 消息到达。
# 启用方法：钉钉开放平台 → 卡片平台 → 新建「AI 卡片」模板，在其中放置一个
# 绑定到变量 `content` 的 Markdown 组件并发布，然后粘贴模板 ID 到此处。
# card_template_id = "your-card-template-id"


# =============================================================================
# 可选的全局功能（按需取消注释）
# =============================================================================
# [[commands]]                   # 自定义斜杠命令
# name = "review"
# description = "评审当前改动"
# prompt = "评审暂存的 git diff，列出具体问题。"

# [cron]                         # 定时任务
# enabled = true
# timezone = "Asia/Shanghai"

# [management]                   # 内嵌 Web 管理界面（无需 Node）
# enabled = true
# port = 9111
